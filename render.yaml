services:
  # Backend API Web Service
  - type: web
    name: pulseplate-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseplate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  # PostgreSQL Database
  - name: pulseplate-db
    databaseName: pulseplate
    user: pulseplate_user
    plan: free

