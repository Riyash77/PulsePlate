services:
  # 1. Backend API Web Service
  - type: web
    name: pulseplate-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulseplate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # 2. Admin Portal (React / Vite Static Site)
  - type: web
    name: pulseplate-admin
    runtime: static
    rootDir: admin-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pulseplate-backend.onrender.com

  # 3. Student Portal (React / Vite Static Site)
  - type: web
    name: pulseplate-student
    runtime: static
    rootDir: student-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pulseplate-backend.onrender.com

databases:
  # 4. Managed PostgreSQL Database
  - name: pulseplate-db
    databaseName: pulseplate
    user: pulseplate_user
    plan: free
